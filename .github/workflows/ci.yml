name: Cypress E2E CI & Scheduled Regression (Conduit RealWorld)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Executa a cada 8 horas (04:00, 12:00, 20:00 UTC)
    - cron: '0 4,12,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cypress-tests-and-log:
    name: Run Cypress Tests & Record Activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Cypress E2E Tests
        run: |
          npm test
          echo "STATUS=PASSED" >> $GITHUB_ENV

      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7

      - name: Update Activity Log
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .github/logs
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "- **Execução:** $NOW | **Status:** ✅ ${{ env.STATUS || 'PASSED' }} | **Módulo:** Cypress Web & Mocks" >> .github/logs/daily-runs.md

      - name: Commit and Push Activity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/logs/daily-runs.md
          if git diff --staged --quiet; then
            echo "Nenhuma alteração a commitar."
          else
            git commit -m "chore(ci): scheduled cypress regression run [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin HEAD:${{ github.ref }}
          fi
